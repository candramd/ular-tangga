services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ular
      POSTGRES_USER: ular
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ular-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ular -d ular"]
      interval: 5s
      timeout: 3s
      retries: 10
  server:
    build: ./server
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://ular:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or .env file}@postgres:5432/ular?sslmode=disable}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,http://127.0.0.1:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TOTAL_STEPS: ${TOTAL_STEPS:-100}
      BOARD_JSON: ${BOARD_JSON:-}
      ADMIN_SECRET: ${ADMIN_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  ular-postgres:
